[package]
name = "crypto-core"
version = "0.1.0"
edition = "2021"
description = "Primitives cryptographiques CEP — signatures, intégrité, audit immuable"

[dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
rand_core = { version = "0.6", features = ["getrandom"] }
